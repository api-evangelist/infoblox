description: Infoblox sells DDI (DNS, DHCP, IPAM) and DNS-layer security through a contact-sales motion.
  Three principal product lines exist - Universal DDI Product Suite, NIOS DDI (on-prem), and Infoblox
  Threat Defense (DNS-layer security) - and APIs ship with these products rather than as a separately
  metered API service. Pricing is not published; quotes are scoped per customer based on protected assets,
  query volume, deployment topology (cloud / on-prem / hybrid), and term length.
notes: All Infoblox pricing is contact-sales. No public per-API rate or per-asset price list. Reconcile
  against an Infoblox sales quote.
