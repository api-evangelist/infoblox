specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Infoblox
providerId: infoblox
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - DDI
  - DNS
  - DHCP
  - IPAM
  - Network Management
  - Rate Limiting
description: Infoblox does not publish public per-second rate-limit numbers for its WAPI (NIOS) or Cloud
  Services Portal APIs. Throughput on NIOS Grid is bounded by Grid Master sizing and concurrent WAPI
  session limits; Cloud Services Portal APIs operate under Infoblox-managed shared infrastructure with
  fair-use throttling. Specific limits are workload-dependent and best obtained from the customer's
  account team.
notes: Numbers below are intentionally string-typed; replace with quotes from Infoblox documentation
  or sales engineers.
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: NIOS WAPI throughput
    scope: grid-master
    metric: varies
    limit: governed by Grid Master appliance sizing and concurrent session limits
    applies:
      - Infoblox NIOS WAPI
  - name: Cloud Services Portal API throughput
    scope: tenant
    metric: varies
    limit: shared-infrastructure fair-use; consult Infoblox CSP documentation
    applies:
      - Infoblox Cloud Services Portal API
policies:
  - name: Backoff Strategy
    description: Clients receiving 429 or 503 should implement exponential backoff with jitter and honor
      Retry-After when present.
  - name: Session Reuse
    description: NIOS WAPI clients should reuse cookie-based sessions across requests rather than authenticating
      per call to avoid login throttling.
  - name: Bulk Operations
    description: Use _ref-based bulk operations and CSV import where available rather than high-volume
      individual API calls.
  - name: Fair Use
    description: Infoblox reserves the right to throttle traffic that materially impacts shared infrastructure.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
