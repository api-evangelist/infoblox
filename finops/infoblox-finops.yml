specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Infoblox
providerId: infoblox
publisherName: Infoblox Inc.
serviceCategory: Network Services + Security
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - DDI
  - DNS
  - DHCP
  - IPAM
  - Network Management
  - FinOps
  - FOCUS
description: FOCUS-aligned FinOps shape for Infoblox. Billing is enterprise subscription (per-protected-asset
  / per-appliance, annual) plus support; APIs are bundled. FinOps practice for Infoblox focuses on entitlement
  utilization, environment consolidation, and renewal-cycle right-sizing rather than per-API-call accounting.
notes: No public per-call or per-query meter; meters below describe the business-level cost drivers (assets,
  appliances, queries protected). Reconcile against the customer's own Infoblox subscription and CSP usage
  reports.
sources:
  - https://www.infoblox.com/products/
  - https://www.infoblox.com/company/contact-us/
principles:
  - name: Visibility
    description: Use the Infoblox Cloud Services Portal to see protected-asset counts, query volume,
      threat-intel hits, and licensed-feature utilization across the Universal DDI suite.
  - name: Allocation
    description: Tag managed assets in Universal DDI and NIOS by business unit / data center / cloud
      account so renewal cost can be attributed; map appliances to cost centers in CMDB.
  - name: Optimization
    description: Right-size protected-asset counts at renewal; consolidate redundant on-prem NIOS appliances
      into cloud-managed Universal DDI; retire stale extensible attributes and unused IPAM networks.
  - name: Accountability
    description: Designate a Network Services owner with annual Infoblox-renewal budget; review utilization
      and growth quarterly with the Infoblox Customer Success team.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
  - name: Optimize Usage and Cost
    capabilities:
      - Architecting for Cloud
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Enterprise Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Tax
    - Adjustment
  chargeFrequency: Recurring
focusColumns:
  ServiceName: Infoblox Universal DDI / NIOS / Threat Defense
  ServiceCategory: Network Services + Security
  ProviderName: Infoblox
  PublisherName: Infoblox Inc.
  InvoiceIssuerName: Infoblox Inc.
  PricingCategory: Subscription
  PricingUnit: protected-asset-year
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: protected_assets
    description: Count of assets / endpoints / IP space under management or protection
    unit: asset-month
    aggregation: max
    dimensions:
      - product_line
      - region
      - business_unit
  - name: appliances
    description: NIOS appliances (physical or virtual) under license
    unit: appliance-month
    aggregation: max
    dimensions:
      - model
      - data_center
  - name: dns_queries_protected
    description: DNS queries protected by Threat Defense
    unit: query
    aggregation: sum
    dimensions:
      - region
      - threat_category
apis:
  - name: Infoblox Universal DDI API
    baseURL: https://csp.infoblox.com/api
    serviceCategory: API
  - name: Infoblox NIOS WAPI
    baseURL: https://{grid-master}/wapi/v2.x
    serviceCategory: API
  - name: Infoblox Cloud Services Portal API
    baseURL: https://csp.infoblox.com/api
    serviceCategory: API
unitEconomics:
  - name: Cost per Protected Asset
    metric: billed_cost / protected_assets
    target: TBD
  - name: Cost per Million DNS Queries Protected
    metric: billed_cost / (dns_queries_protected / 1000000)
    target: TBD
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
