    - name: record:a
      path: /record:a
      operations:
      - name: listarecords
        method: GET
        description: Infoblox List DNS A records
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: Filter by the fully qualified domain name of the A record.
        - name: ipv4addr
          in: query
          type: string
          description: Filter by the IPv4 address of the A record.
        - name: view
          in: query
          type: string
          description: Filter by the DNS view name.
        - name: zone
          in: query
          type: string
          description: Filter by the DNS zone name.
      - name: createarecord
        method: POST
        description: Infoblox Create a DNS A record
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
