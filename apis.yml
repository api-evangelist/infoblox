aid: infoblox
name: Infoblox
description: >-
  Infoblox is a networking and cybersecurity company providing DDI (DNS, DHCP, and IPAM) solutions and protective
  DNS-layer security services. Its product portfolio spans the Universal DDI suite for unified hybrid and multi-cloud
  network services, NIOS DDI for on-premises deployments, NIOS-X as a Service, Threat Defense for DNS-layer security,
  threat intelligence (TIDE) and research (Dossier), and NetMRI for network change and configuration management.
